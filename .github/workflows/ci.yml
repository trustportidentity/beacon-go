name: CI & SOC2 Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: beacon-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test -v -race ./...

  security-audit:
    name: CVE Vulnerability Scan & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: govulncheck — Go CVE vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Run Trivy Vulnerability Scanner (CVEs)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Secret Scan
        run: |
          if grep -rn \
            -e 'password\s*=\s*"[^"]\+"' \
            -e 'private_key\s*=\s*"[^"]\+"' \
            --include="*.go" \
            --exclude-dir=".git" \
            --exclude="*_test.go" \
            .; then
            echo "❌ Hardcoded secret pattern detected"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  soc2-verification-passed:
    name: SOC2 Verification & Flow Check
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: always()
    steps:
      - name: Enforce All SOC2 Gates Passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ SOC2 compliance check failed."
            exit 1
          fi
          echo "✅ All SOC2 security, CVE scan, and test gates passed."
